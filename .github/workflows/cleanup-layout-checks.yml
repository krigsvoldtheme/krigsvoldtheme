name: Stop superseded layout checks
on: [push]
permissions:
  actions: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/work/layout-system' || github.ref == 'refs/heads/work/layout-showcase'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { ...context.repo, branch, status: 'in_progress', per_page: 100 });
            for (const run of runs) {
              if (run.head_sha !== context.sha && ['.github/workflows/verify.yml', '.github/workflows/ci.yml'].includes(run.path)) {
                core.info('Cancel superseded layout check ' + run.id);
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
